[behave]
paths = features
# Keep print() output from steps out of the report unless a scenario fails.
capture = true

[behave.userdata]
# Scenario order (see features/environment.py):
#   random  - shuffle features, scenarios and example rows (default)
#   defined - run in file order
#   reverse - run everything in reverse file order
# Override per run with: behave -D order=defined   /   behave -D seed=1234
order = random
